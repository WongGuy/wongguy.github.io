<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech Refs/Socket Screw Selector</title>
  <script src="theme.js"></script>
  <script src="site-nav-data.js"></script>
  <script src="tab-nav.js"></script>
  <script src="footer.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>Mech Refs</h1>
  </header>

  <main>
    <section class="chart-card">
      <div class="site-nav"></div>
      <div class="chart-card-header">
        <h2>Socket Screw Selector</h2>
        <div class="chart-card-subheader">
          <h3>(ISO 262, 273, 2306, 4762, 7380, 10642)</h3>
        </div>
      </div>
      <div class="chart-layout">
        <div class="slider-sticky">
          <div class="slider-block">
            <div id="size-readout" class="size-readout">M6</div>
            <div class="slider-track-wrap">
              <input
                type="range"
                id="size-slider"
                class="size-slider"
                min="0"
                max="14"
                step="1"
                value="6"
                aria-label="Select major diameter"
              />
              <div id="slider-ticks" class="slider-ticks"></div>
              <div class="slider-endpoints">
                <span id="slider-min-label"></span>
                <span id="slider-max-label"></span>
              </div>
            </div>
            <label class="detail-toggle">
              <input type="checkbox" id="detail-toggle" />
              I Crave<br />Detail!
            </label>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Thread and Hole Dimensions</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/screw/thread-diagram.svg"
                alt="ISO metric thread diagram"
                class="diagram-image"
              />
            </div>
            <div id="spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Socket Head Cap Screw - ISO 4762 - SHCS</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/screw/shcs-diagram.svg"
                alt="Socket head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="shcs-spec-panel" class="spec-panel"></div>
          </div>
          <div id="shcs-length-chart" class="length-chart"></div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Flat Head Cap Screw - ISO 10642 - FHCS</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/screw/fhcs-diagram.svg"
                alt="Flat head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="fhcs-spec-panel" class="spec-panel"></div>
          </div>
          <div id="fhcs-length-chart" class="length-chart"></div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Button Head Cap Screw - ISO 7380 - BHCS</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/screw/bhcs-diagram.svg"
                alt="Button head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="bhcs-spec-panel" class="spec-panel"></div>
          </div>
          <div id="bhcs-length-chart" class="length-chart"></div>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="tools/screw/screw-data.js"></script>
  <script src="tools/screw/screw-app.js"></script>
</body>
</html>
