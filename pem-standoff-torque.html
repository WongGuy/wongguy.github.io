<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WongSize/PEM Standoff Torque</title>
  <script src="theme.js"></script>
  <script src="site-nav-data.js"></script>
  <script src="tab-nav.js"></script>
  <script src="footer.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>WongSize</h1>
  </header>

  <main>
    <section class="chart-card">
      <div class="site-nav"></div>
      <div class="chart-card-header">
        <h2>PEM Standoff Torque</h2>
        <div class="chart-card-subheader">
          <h3>(<a href="https://www.pemnet.com/wp-content/uploads/sites/9/2022/06/sodata.pdf">PennEngineering PEM® fastener data</a>) Maximum recommended tightening torque for a mating screw threaded into a PEM self-clinching standoff, by standoff type and material.</h3>
        </div>
      </div>
      <div class="chart-layout">
        <div class="slider-sticky">
          <div class="slider-block">
            <div id="size-readout" class="size-readout">M3</div>
            <div class="slider-track-wrap">
              <input
                type="range"
                id="size-slider"
                class="size-slider"
                min="0"
                max="0"
                step="1"
                value="0"
                aria-label="Select thread diameter"
              />
              <div id="slider-ticks" class="slider-ticks"></div>
              <div class="slider-endpoints">
                <span id="slider-min-label"></span>
                <span id="slider-max-label"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="spec-group" id="torque-plot-group">
          <h3 class="spec-group-title" id="plot-title">Mating Screw Tightening Torque</h3>
          <div id="view-toggle" class="metric-toggle" role="group" aria-label="View"></div>
          <div id="torque-plot" class="plot"></div>
          <div id="torque-table-view" hidden>
            <div id="torque-table-wrap" class="est-table-wrap"></div>
            <div id="torque-table-legend"></div>
          </div>
          <div class="plot-note">
            <h4>Notes</h4>
            <ul id="series-notes"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="tools/pem-standoff-torque/pem-standoff-torque-data.js"></script>
  <script src="plot.js"></script>
  <script src="tools/pem-standoff-torque/pem-standoff-torque-app.js"></script>
</body>
</html>
