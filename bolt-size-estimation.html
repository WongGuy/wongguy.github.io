<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech Refs/Screw Size Estimation</title>
  <script src="theme.js"></script>
  <script src="site-nav-data.js"></script>
  <script src="tab-nav.js"></script>
  <script src="footer.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>Mech Refs</h1>
  </header>

  <main>
    <section class="chart-card">
      <div class="site-nav"></div>
      <div class="chart-card-header">
        <h2>Screw Size Estimation</h2>
        <div class="chart-card-subheader">
          <h3>Uses ISO 898-1 proof loads and VDI guideline 2230 to return a rough screw size estimate. Use this as an initial sniff check before doing detailed analysis.</h3>
        </div>
      </div>
      <div class="chart-layout">
        <hr class="chart-card-rule" />
        <div class="spec-group">
          <h3 class="spec-group-title">
            Load Condition: <span id="load-case-label" class="est-selected"></span>
          </h3>
          <div
            id="load-case-row"
            class="est-case-row"
            role="radiogroup"
            aria-label="Load condition"
          ></div>
        </div>

        <div class="spec-group">
          <h3 class="spec-group-title">
            Tightening Method: <span id="method-label" class="est-selected"></span>
          </h3>
          <div
            id="method-list"
            class="est-method-list"
            role="radiogroup"
            aria-label="Tightening method"
          ></div>
        </div>

        <div class="spec-group">
          <h3 class="spec-group-title">Force Per Bolt (Leave blank to view full table)</h3>
          <div class="est-force-row">
            <button type="button" id="force-clear" class="est-force-clear">Clear</button>
            <input
              type="number"
              id="force-input"
              class="est-force-input"
              min="0"
              step="any"
              inputmode="decimal"
              placeholder="0"
              aria-label="Force per bolt in newtons"
            />
            <span class="est-force-unit">N</span>
          </div>
        </div>

        <div class="spec-group">
          <h3 class="spec-group-title" id="table-title"></h3>
          <div class="est-toggle-row">
            <label class="est-uts-toggle">
              <input type="checkbox" id="uts-toggle" />
              <span>Show UTS Load</span>
            </label>
            <label class="est-uts-toggle">
              <input type="checkbox" id="fine-toggle" />
              <span>Include Fine Pitches</span>
            </label>
          </div>
          <p id="steps-note" class="est-steps-note"></p>
          <div class="est-table-wrap">
            <table id="size-table" class="est-table"></table>
          </div>
          <p id="table-legend" class="est-legend"></p>
          <p id="table-message" class="est-message"></p>
        </div>

        <div class="spec-group">
          <h3 class="spec-group-title">Property Classes</h3>
          <button type="button" id="grade-common" class="est-grade-preset">Show common</button>
          <div id="grade-toggles" class="est-grades"></div>
        </div>

        <div class="plot-note" id="source-notes"></div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="tools/screw-strength/screw-strength-data.js"></script>
  <script src="tools/screw-strength/screw-strength-app.js"></script>
</body>
</html>
