<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WongSize/General Tolerances</title>
  <script src="theme.js"></script>
  <script src="site-nav-data.js"></script>
  <script src="tab-nav.js"></script>
  <script src="footer.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>WongSize</h1>
  </header>

  <main>
    <section class="chart-card">
      <div class="site-nav"></div>
      <div class="chart-card-header">
        <h2>General Tolerances</h2>
        <div class="chart-card-subheader">
          <h3>ISO 2768-1 general tolerances. A delightful standard unchanged since 1973.</h3>
        </div>
      </div>
      <div class="chart-layout">
        <hr class="chart-card-rule" />
        <div id="tolerance-tables"></div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="tools/tolerances/tolerances-data.js"></script>
  <script src="plot.js"></script>
  <script src="tools/tolerances/tolerances-app.js"></script>
</body>
</html>
