<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech Refs</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>Eric's Mech Refs</h1>
  </header>

  <main>
    <section class="chart-card">
      <div class="chart-card-header">
        <h2>ISO Metric Screw Thread Chart</h2>
        <label class="detail-toggle">
          <input type="checkbox" id="detail-toggle" />
          I Crave Detail
        </label>
      </div>
      <div class="chart-layout">
        <div class="slider-sticky">
          <div class="slider-block">
            <div id="size-readout" class="size-readout">M6</div>
            <div class="slider-track-wrap">
              <input
                type="range"
                id="size-slider"
                class="size-slider"
                min="0"
                max="14"
                step="1"
                value="6"
                aria-label="Select major diameter"
              />
              <div id="slider-ticks" class="slider-ticks"></div>
              <div class="slider-endpoints">
                <span id="slider-min-label"></span>
                <span id="slider-max-label"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Thread Dimensions</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/thread-diagram.svg"
                alt="ISO metric thread diagram"
                class="diagram-image"
              />
            </div>
            <div id="spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Socket Head Cap Screw</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/shcs-diagram.svg"
                alt="Socket head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="shcs-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Flat Head Cap Screw</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/fhcs-diagram.svg"
                alt="Flat head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="fhcs-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group">
          <h3 class="spec-group-title">Button Head Cap Screw</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/bhcs-diagram.svg"
                alt="Button head cap screw diagram"
                class="diagram-image"
              />
            </div>
            <div id="bhcs-spec-panel" class="spec-panel"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Vibe coded interface, real ISO values.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
