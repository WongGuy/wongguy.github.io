<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mech Refs/Nut Selector</title>
  <script src="theme.js"></script>
  <script src="tab-nav.js"></script>
  <script src="footer.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="theme-toggle-wrap">
      <label class="theme-switch">
        <span class="theme-switch-icon" aria-hidden="true">☀</span>
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode" />
        <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
        <span class="theme-switch-icon" aria-hidden="true">☾</span>
      </label>
    </div>
    <h1>Mech Refs</h1>
  </header>

  <main>
    <section class="chart-card">
      <nav class="tab-nav" aria-label="Reference tool selection">
        <ul>
          <li><a href="screw-selector.html" class="tab-nav-link">Socket Screw Selector</a></li>
          <li><a href="nut-selector.html" class="tab-nav-link" aria-current="page">Nut Selector</a></li>
          <li><a href="washer-selector.html" class="tab-nav-link">Washer Selector</a></li>
        </ul>
      </nav>
      <div class="chart-card-header">
        <h2>Nut Selector</h2>
        <div class="chart-card-subheader">
          <h3>(ISO 4032, 4033, 4035, 4161)</h3>
          <button
            type="button"
            id="flowchart-collapse-toggle"
            class="flowchart-collapse-toggle"
            aria-expanded="true"
            aria-controls="nut-flowchart-group"
          >Hide Flowchart</button>
        </div>
      </div>
      <div class="chart-layout">
        <div class="slider-sticky">
          <div class="slider-block">
            <div id="size-readout" class="size-readout">M6</div>
            <div class="slider-track-wrap">
              <input
                type="range"
                id="size-slider"
                class="size-slider"
                min="0"
                max="13"
                step="1"
                value="6"
                aria-label="Select thread diameter"
              />
              <div id="slider-ticks" class="slider-ticks"></div>
              <div class="slider-endpoints">
                <span id="slider-min-label"></span>
                <span id="slider-max-label"></span>
              </div>
            </div>
            <label class="detail-toggle">
              <input type="checkbox" id="detail-toggle" />
              I Crave<br />Detail!
            </label>
          </div>
        </div>
        <div class="spec-group" id="nut-flowchart-group">
          <h3 class="spec-group-title">Nut Selection Flowchart</h3>
          <div id="flowchart" class="flowchart"></div>
        </div>
        <div class="spec-group" id="nut-iso-4032">
          <h3 class="spec-group-title">Standard Nut - ISO 4032</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/nut/std-diagram.svg"
                alt="Standard nut diagram"
                class="diagram-image diagram-image--sm"
              />
            </div>
            <div id="std-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group" id="nut-iso-4033">
          <h3 class="spec-group-title">Tall Nut - ISO 4033</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/nut/tall-diagram.svg"
                alt="Tall nut diagram"
                class="diagram-image diagram-image--sm"
              />
            </div>
            <div id="tall-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group" id="nut-iso-4035">
          <h3 class="spec-group-title">Thin Nut - ISO 4035</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/nut/thin-diagram.svg"
                alt="Thin nut diagram"
                class="diagram-image diagram-image--sm"
              />
            </div>
            <div id="thin-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group" id="nut-iso-4161">
          <h3 class="spec-group-title">Flanged Nut - ISO 4161</h3>
          <div class="chart-row">
            <div class="diagram-panel">
              <img
                src="assets/images/nut/flanged-diagram.svg"
                alt="Flanged nut diagram"
                class="diagram-image diagram-image--sm"
              />
            </div>
            <div id="flanged-spec-panel" class="spec-panel"></div>
          </div>
        </div>
        <div class="spec-group">
          <p id="flowchart-disclaimer" class="flowchart-disclaimer"></p>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="nut-data.js"></script>
  <script src="nut-app.js"></script>
  <script src="flowchart.js"></script>
  <script src="nut-flowchart-data.js"></script>
</body>
</html>
